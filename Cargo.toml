[package]
name = "nicehck-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Windows controller for NiceHCK Bluetooth earphones"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
serialport = { version = "4.9", default-features = false }
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    "compat-1-2",
] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_SerialCommunication",
    "Networking_Sockets",
    "Storage_Streams",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
